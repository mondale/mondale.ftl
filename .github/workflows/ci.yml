name: CI & Test Pipeline

# Trigger the workflow on every push to any branch
on:
  push:

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the repository source code onto the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          # Download and run the official LLVM installation script, specifying version 21
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

          # Install the matching LLVM/Clang standard library and tooling packages
          sudo apt-get install -y \
            libnuma-dev \
            libssl-dev \
            clang-21 \
            libc++-21-dev \
            libc++abi-21-dev \
            lld-21 \
            llvm-21 \
            llvm-21-cov \
            git \
            curl

      - name: Set Clang as System Default Compiler
        run: |
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/clang++-21 100
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/clang-21 100

      - name: Dump Compilation Version
        run : |
          /usr/bin/c++ -v

      - name: Ensure llvm-cov is Symlinked
        run: |
          # Dynamically link llvm-cov-21 to standard path as llvm-cov
          if ! command -v llvm-cov &> /dev/null; then
            if [ -f /usr/bin/llvm-cov-21 ]; then
              sudo ln -s /usr/bin/llvm-cov-21 /usr/bin/llvm-cov
            else
              LLVM_COV_PATH=$(ls /usr/bin/llvm-cov-* | head -n 1)
              [ -n "$LLVM_COV_PATH" ] && sudo ln -s "$LLVM_COV_PATH" /usr/bin/llvm-cov
            fi
          fi

      # 3. Install the Please build system and add it to the system PATH
      - name: Install Please Build System
        run: |
          curl https://get.please.build | bash
          echo "$HOME/.please" >> $GITHUB_PATH

      # 4. Invoke your custom test orchestration script
      - name: Run All Tests
        run: |
          chmod +x ./tools/run_all_tests.sh
          ./tools/run_all_tests.sh
