name: CI & Test Pipeline

# Trigger the workflow on every push to any branch
on:
  push:

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the repository source code onto the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libnuma-dev \
            libssl-dev \
            clang \
            lld \
            curl \
            git

      - name: Set Clang as System Default Compiler
        run: |
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/clang++ 100
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/clang 100

      - name: Dump Compilation Version
        run : |
          g++ -v

      # 2. Explicitly point Please/environment to Clang
      - name: Configure Compiler Environment
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      # 3. Install the Please build system and add it to the system PATH
      - name: Install Please Build System
        run: |
          curl https://get.please.build | bash
          echo "$HOME/.please" >> $GITHUB_PATH

      # 4. Invoke your custom test orchestration script
      - name: Run All Tests
        run: |
          chmod +x ./tools/run_all_tests.sh
          ./tools/run_all_tests.sh
